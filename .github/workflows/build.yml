name: Build & Release APK

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # required by softprops/action-gh-release to publish releases

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Decode the signing keystore from a GitHub secret. When absent (e.g.
      # on a forked PR) the release APK is built unsigned and the publish
      # step below is skipped. We surface presence as an env flag so step
      # `if` conditions never reference the secrets context directly.
      SPENDAI_SIGNING_STORE_FILE: ${{ github.workspace }}/keystore/spendai-release.jks
      SPENDAI_SIGNING_STORE_PASSWORD: ${{ secrets.SPENDAI_SIGNING_STORE_PASSWORD }}
      SPENDAI_SIGNING_KEY_ALIAS: ${{ secrets.SPENDAI_SIGNING_KEY_ALIAS }}
      SPENDAI_SIGNING_KEY_PASSWORD: ${{ secrets.SPENDAI_SIGNING_KEY_PASSWORD }}
      SPENDAI_SIGNING_KEY_BASE64: ${{ secrets.SPENDAI_SIGNING_KEY_BASE64 }}
      HAS_SIGNING_KEY: ${{ secrets.SPENDAI_SIGNING_KEY_BASE64 != '' }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Materialise signing keystore from secret
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          mkdir -p keystore
          printf '%s' "${SPENDAI_SIGNING_KEY_BASE64}" | base64 -d > "${SPENDAI_SIGNING_STORE_FILE}"
          echo "Keystore decoded."

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Locate debug APK
        id: debug
        run: |
          f=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "name=$(basename "$f")" >> "$GITHUB_OUTPUT"

      - name: Locate release APK
        id: release
        run: |
          f=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "name=$(basename "$f")" >> "$GITHUB_OUTPUT"
          echo "path=$f" >> "$GITHUB_OUTPUT"

      - name: Verify release APK is signed
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          APKSIGNER="$(ls "${ANDROID_HOME}"/build-tools/*/apksigner | sort | tail -1)"
          "$APKSIGNER" verify --print-certs "${{ steps.release.outputs.path }}" | grep -q "Signer #1" \
            && echo "APK signed OK" || (echo "APK not signed" && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: spendai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: spendai-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with the signed APK
        if: env.IS_TAG == 'true' && env.HAS_SIGNING_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

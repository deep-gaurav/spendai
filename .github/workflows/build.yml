name: Build & Release APK

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # required to create/move releases and tags

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Signing secrets come from GitHub Actions secrets (see README). When
      # absent (e.g. a forked PR) the release variant is debug-signed so the
      # rolling APK still installs; the signed-tag release step is skipped.
      SPENDAI_SIGNING_STORE_FILE: ${{ github.workspace }}/keystore/spendai-release.jks
      SPENDAI_SIGNING_STORE_PASSWORD: ${{ secrets.SPENDAI_SIGNING_STORE_PASSWORD }}
      SPENDAI_SIGNING_KEY_ALIAS: ${{ secrets.SPENDAI_SIGNING_KEY_ALIAS }}
      SPENDAI_SIGNING_KEY_PASSWORD: ${{ secrets.SPENDAI_SIGNING_KEY_PASSWORD }}
      SPENDAI_SIGNING_KEY_BASE64: ${{ secrets.SPENDAI_SIGNING_KEY_BASE64 }}
      HAS_SIGNING_KEY: ${{ secrets.SPENDAI_SIGNING_KEY_BASE64 != '' }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Materialise signing keystore from secret
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          mkdir -p keystore
          printf '%s' "${SPENDAI_SIGNING_KEY_BASE64}" | base64 -d > "${SPENDAI_SIGNING_STORE_FILE}"
          echo "Keystore decoded."

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Locate debug APK
        id: debug
        run: |
          f=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "name=$(basename "$f")" >> "$GITHUB_OUTPUT"

      - name: Locate release APK
        id: release
        run: |
          f=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "name=$(basename "$f")" >> "$GITHUB_OUTPUT"
          echo "path=$f" >> "$GITHUB_OUTPUT"

      - name: Verify release APK is signed
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          APKSIGNER="$(ls "${ANDROID_HOME}"/build-tools/*/apksigner | sort | tail -1)"
          "$APKSIGNER" verify --print-certs "${{ steps.release.outputs.path }}" | grep -q "Signer #1" \
            && echo "APK signed OK" || (echo "APK not signed" && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: spendai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: spendai-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Rolling release: on every successful master push, recreate the
      # `rolling` prerelease with the freshly built (debug-signed, minified)
      # release APK. The download URL releases/download/rolling/spendai.apk
      # is stable across rebuilds - this is the link the README points at.
      - name: Publish rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG=rolling
          SHA=${GITHUB_SHA}
          # Stable asset name regardless of AGP's variant naming.
          cp app/build/outputs/apk/release/*.apk spendai.apk
          NOTES="Automatic rolling build from commit ${SHA:0:7}.

          Built by GitHub Actions from the master branch. This is a
          debug-signed, minified release APK - install it with:
          adb install -r spendai.apk

          For a properly signed build, push a v* tag after configuring
          the SPENDAI_SIGNING_* secrets."
          # Recreate the release (and its tag) each run so it tracks master.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" spendai.apk \
            --title "Rolling build" \
            --notes "$NOTES" \
            --prerelease \
            --target "$SHA"

      # Proper signed versioned release on a v* tag (requires signing secrets).
      - name: Publish signed tag release
        if: env.IS_TAG == 'true' && env.HAS_SIGNING_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

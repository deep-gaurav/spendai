name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-master
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Signing secrets come from GitHub Actions secrets. When absent the
      # release variant is debug-signed so the APK still installs.
      SPENDAI_SIGNING_STORE_FILE: ${{ github.workspace }}/keystore/spendai-release.jks
      SPENDAI_SIGNING_STORE_PASSWORD: ${{ secrets.SPENDAI_SIGNING_STORE_PASSWORD }}
      SPENDAI_SIGNING_KEY_ALIAS: ${{ secrets.SPENDAI_SIGNING_KEY_ALIAS }}
      SPENDAI_SIGNING_KEY_PASSWORD: ${{ secrets.SPENDAI_SIGNING_KEY_PASSWORD }}
      SPENDAI_SIGNING_KEY_BASE64: ${{ secrets.SPENDAI_SIGNING_KEY_BASE64 }}
      HAS_SIGNING_KEY: ${{ secrets.SPENDAI_SIGNING_KEY_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Materialise signing keystore from secret
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          mkdir -p keystore
          printf '%s' "${SPENDAI_SIGNING_KEY_BASE64}" | base64 -d > "${SPENDAI_SIGNING_STORE_FILE}"
          echo "Keystore decoded."

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build release APK
        # Skip lintVital* on CI: AGP auto-attaches it to release assembly and
        # it adds ~3 min while producing nothing the build needs. Lint still
        # runs locally via `./gradlew :app:lint`.
        run: ./gradlew :app:assembleRelease -x lintVitalRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease --no-daemon

      - name: Locate debug APK
        id: debug
        run: |
          f=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "name=$(basename "$f")" >> "$GITHUB_OUTPUT"

      - name: Locate release APK
        id: release
        run: |
          f=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "name=$(basename "$f")" >> "$GITHUB_OUTPUT"
          echo "path=$f" >> "$GITHUB_OUTPUT"

      - name: Verify release APK is signed
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          APKSIGNER="$(ls "${ANDROID_HOME}"/build-tools/*/apksigner | sort | tail -1)"
          # `apksigner verify`'s own exit code is the source of truth for
          # "is this APK validly signed" — grepping --print-certs output
          # for a literal string was fragile (any stderr-only failure,
          # or an output-format change, reads as "not signed" with zero
          # diagnostic info). Print certs for visibility, then verify.
          "$APKSIGNER" verify --print-certs "${{ steps.release.outputs.path }}" || true
          "$APKSIGNER" verify "${{ steps.release.outputs.path }}" \
            && echo "APK signed OK" || (echo "APK signature verification failed" && exit 1)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spendai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spendai-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
